<script>
 const $=s=>document.querySelector(s);function loadStore(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v===null?fallback:v}catch{return fallback}}const oldProfiles=loadStore('life-guide-profiles-v1',[]);const oldActiveId=loadStore('life-guide-active-profile','default');const oldActive=Array.isArray(oldProfiles)?(oldProfiles.find(p=>p.id===oldActiveId)||oldProfiles[0]||{}):{};function readLocal(key,oldValue){try{const saved=localStorage.getItem(key);if(saved!==null)return JSON.parse(saved)}catch{}return oldValue||[]}let favorites=new Set(readLocal('life-guide-favs',oldActive.favorites||[])),readDone=new Set(readLocal('life-guide-read',oldActive.read||[])),viewHistory=new Set(readLocal('life-guide-history',oldActive.history||[]));function saveProfile(){try{localStorage.setItem('life-guide-favs',JSON.stringify([...state.favorites]));localStorage.setItem('life-guide-read',JSON.stringify([...readDone]));localStorage.setItem('life-guide-history',JSON.stringify([...viewHistory]))}catch{}}const state={q:'',section:'',evidence:'',quick:'',favorites,readMode:false,batchIds:[]};const sel=$('#section');chapters.forEach(c=>{let o=document.createElement('option');o.value=c.num;o.textContent=`${c.num}. ${c.title}`;sel.append(o);let f=document.createElement('option');f.value=c.num;f.textContent=`${c.num}. ${c.title}`;$('#feedTopic').append(f)});function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function highlighted(s){return esc(s)}
function render(){let q=state.q.trim().toLowerCase();let found=items.filter(x=>{let hay=[x.title,x.sectionTitle,x.plain,x.cost,x.benefit,x.evidence,x.value,x.sources,x.notes,x.text].join(' ').toLowerCase();return(!q||q.split(/\s+/).every(w=>hay.includes(w)))&&(!state.section||String(x.section)===state.section)&&(!state.evidence||x.evidence===state.evidence)&&(!state.quick||(state.quick==='favorites'?state.favorites.has(x.id):viewHistory.has(x.id))) });if(state.quick==='history'){let order=[...viewHistory];found.sort((a,b)=>order.lastIndexOf(b.id)-order.lastIndexOf(a.id))}if(state.readMode)found=state.batchIds.map(id=>items[id-1]).filter(x=>x&&!readDone.has(x.id));$('#count').textContent=state.readMode?`本次 ${found.length} 条 · 已读 ${readDone.size} / ${items.length}`:`找到 ${found.length} 条`;$('#resultHint').textContent=state.readMode?'按原书顺序阅读，读完一条就标记一条':'默认按原书顺序';$('#readingProgress').value=readDone.size;$('#readingStatus').textContent=readDone.size>=items.length?'全部读完了。愿意的话，可以重置进度再读一遍。':`已读 ${readDone.size} / ${items.length} 条 · 下次从第 ${Math.min(items.length,([...items].findIndex(x=>!readDone.has(x.id))+1))} 条附近继续，不记录连续天数。`;$('#startReading').textContent=state.readMode?'本次阅读中':'从上次位置接着读';$('#startReading').disabled=state.readMode;$('#stopReading').hidden=!state.readMode;let root=$('#results');if(!found.length){root.innerHTML=state.readMode?`<div class="empty">${readDone.size>=items.length?'恭喜，整本内容都读完了！':'这次的几条已经读完。下次打开后继续即可。'}</div>`:'<div class="empty">没找到匹配条目。试着换个关键词或清空筛选。</div>';return}root.innerHTML=found.slice(0,120).map(x=>`<article class="card"><div class="cardtop"><span class="tag">${x.section}. ${esc(x.sectionTitle)}</span>${x.evidence?`<span class="tag gray">证据 ${esc(x.evidence)}</span>`:''}<button class="fav ${state.favorites.has(x.id)?'on':''}" data-fav="${x.id}">${state.favorites.has(x.id)?'★ 已收藏':'☆ 收藏'}</button></div><h2 class="title">${highlighted(x.title)}</h2>${x.plain?`<p class="plain">${highlighted(x.plain)}</p>`:''}${x.cost?`<p class="detail"><b>成本：</b>${highlighted(x.cost)}</p>`:''}${x.benefit?`<p class="detail"><b>收益：</b>${highlighted(x.benefit)}</p>`:''}${x.notes?`<p class="detail"><b>备注：</b>${highlighted(x.notes)}</p>`:''}${x.sources?`<div class="source"><b>来源：</b>${highlighted(x.sources)}<br>原 PDF 第 ${x.printedPage} 页</div>`:`<div class="source">原 PDF 第 ${x.printedPage} 页</div>`}${state.readMode?`<button class="read-done" data-read="${x.id}">✓ 这条读完了</button>`:''}<details><summary>查看完整条目文本</summary><div class="raw">${esc(x.text)}</div></details></article>`).join('')+(found.length>120?`<div class="empty">当前显示前 120 条；请增加筛选条件缩小结果。</div>`:'');root.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let id=+b.dataset.fav;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);saveProfile();render()});root.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{readDone.add(+b.dataset.read);saveProfile();render()})}
items.forEach((x,i)=>x.id=i+1);
let feedIds=[],feedIndex=0;const feedScreen=$('#feedScreen'),feedStage=$('#feedStage');
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeFeed(){let topic=$('#feedTopic').value;feedIds=shuffle(items.filter(x=>!topic||String(x.section)===topic).map(x=>x.id));feedIndex=0;feedStage.innerHTML=feedIds.map(id=>{let x=items[id-1];return `<section class="feed-card" data-card="${id}"><div class="feed-content"><div class="feed-kicker"><span>${x.section}. ${esc(x.sectionTitle)}</span>${x.evidence?`<span>· 证据 ${esc(x.evidence)}</span>`:''}</div><h2>${esc(x.title)}</h2>${x.plain?`<p class="feed-plain">${esc(x.plain)}</p>`:`<p class="feed-plain">${esc(x.cost)}</p>`}${x.cost&&x.plain?`<p class="feed-cost"><b>成本：</b>${esc(x.cost)}</p>`:''}<div class="feed-actions"><button data-feed-fav="${id}" class="${state.favorites.has(id)?'on':''}">${state.favorites.has(id)?'★ 已收藏':'☆ 收藏'}</button><button data-feed-prev="1">↑ 上一条</button><button data-feed-next="1">↓ 下一条</button></div><details class="feed-more"><summary>展开收益、备注与出处</summary><p><b>收益：</b>${esc(x.benefit||'原文未单列收益')}</p><p><b>备注：</b>${esc(x.notes||'无')}</p><p><b>来源：</b>${esc(x.sources||'无')}

function updateSwipeProgress(){let n=readDone.size;$('#feedProgress').value=n;$('#feedProgressText').textContent=`已刷 ${n} / ${items.length}（${Math.round(n/items.length*100)}%）`}function updateFeedCounter(){let h=feedStage.clientHeight||1,nextIndex=Math.max(0,Math.min(feedIds.length,Math.round(feedStage.scrollTop/h))),changed=false;if(nextIndex!==feedIndex){for(let i=Math.min(feedIndex,nextIndex);i<Math.max(feedIndex,nextIndex);i++){let passed=feedIds[i];if(passed&&!readDone.has(passed)){readDone.add(passed);changed=true}}feedIndex=nextIndex}$('#feedCounter').textContent=feedIds.length?`${Math.min(feedIndex+1,feedIds.length)} / ${feedIds.length}`:'0 / 0';let viewed=feedIds[feedIndex];if(viewed&&!viewHistory.has(viewed)){viewHistory.add(viewed);changed=true}if(changed)saveProfile();updateSwipeProgress()}

$('#feedOpen').onclick=()=>{feedScreen.hidden=false;document.body.style.overflow='hidden';makeFeed();feedStage.focus()};$('#feedClose').onclick=()=>{feedScreen.hidden=true;document.body.style.overflow='';};$('#feedTopic').onchange=makeFeed;feedStage.addEventListener('scroll',updateFeedCounter,{passive:true});feedStage.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.id==='feedAgain'){makeFeed();return}if(t.dataset.feedNext){feedMove(1);return}if(t.dataset.feedPrev){feedMove(-1);return}if(t.dataset.feedFav){let id=+t.dataset.feedFav;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);saveProfile();t.classList.toggle('on',state.favorites.has(id));t.textContent=state.favorites.has(id)?'★ 已收藏':'☆ 收藏'}});
document.addEventListener('keydown',e=>{if(feedScreen.hidden)return;if(e.key==='Escape'){ $('#feedClose').click();return}if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();feedMove(1)}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();feedMove(-1)}});
$('#startReading').onclick=()=>{state.readMode=true;state.q='';state.section='';state.evidence='';state.quick='';$('#q').value='';sel.value='';document.querySelectorAll('.check').forEach(x=>x.classList.remove('active'));let n=+$('#batchSize').value;state.batchIds=items.filter(x=>!readDone.has(x.id)).slice(0,n).map(x=>x.id);render()};$('#stopReading').onclick=()=>{state.readMode=false;render()};$('#q').oninput=e=>{state.q=e.target.value;render()};sel.onchange=e=>{state.section=e.target.value;render()};document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{state.quick=state.quick===b.dataset.quick?'':b.dataset.quick;document.querySelectorAll('[data-quick]').forEach(k=>k.classList.toggle('active',k===b&&state.quick));render()});$('#clear').onclick=()=>{state.q=state.section=state.evidence=state.quick='';$('#q').value='';sel.value='';document.querySelectorAll('.check').forEach(x=>x.classList.remove('active'));render()};let params=new URLSearchParams(location.search);state.q=params.get('q')||'';state.section=params.get('section')||'';$('#q').value=state.q;sel.value=state.section;render();var __fb=document.getElementById('feedOpen');if(__fb)__fb.disabled=false;var __fa=document.getElementById('feedArrow');if(__fa)__fa.textContent='开始 →';
